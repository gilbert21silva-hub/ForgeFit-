name: ForgeFit preview load test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Vercel preview URL (no trailing slash)"
        required: true
        default: "https://forge-fit-git-agent-production-r-e246df-gilbert-silvas-projects.vercel.app"

permissions:
  contents: read

jobs:
  public-smoke-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out test
        uses: actions/checkout@v4
      - name: Run staged public-page load test
        uses: grafana/setup-k6-action@v1
      - name: Execute k6
        env:
          FORGEFIT_BASE_URL: ${{ inputs.base_url }}
        run: k6 run tests/load/forgefit-smoke.js
