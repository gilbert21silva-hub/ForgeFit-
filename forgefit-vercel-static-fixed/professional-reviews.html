<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional Reviews | ForgeFit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,system-ui,sans-serif}</style></head><body class="min-h-screen bg-zinc-950 text-white">
<header class="border-b border-white/10"><div class="mx-auto flex h-16 max-w-4xl items-center justify-between px-4"><a href="/" class="font-black">ForgeFit</a><a id="back" class="rounded-xl border border-zinc-700 px-4 py-2 text-sm font-bold">Back to profile</a></div></header>
<main class="mx-auto max-w-4xl px-4 py-10"><p class="text-xs font-black uppercase tracking-[.2em] text-amber-400">Verified experiences</p><h1 id="title" class="mt-2 text-4xl font-black">Professional reviews</h1><div id="summary" class="mt-5 rounded-2xl border border-amber-400/20 bg-amber-400/5 p-5 text-lg font-black">No reviews yet</div>
<section id="reviewFormSection" class="mt-7 hidden rounded-3xl border border-white/10 bg-zinc-900 p-6"><h2 class="text-xl font-black">Share your experience</h2><p class="mt-2 text-sm text-zinc-400">Only verified clients with an active or previous service relationship can leave a review.</p><form id="reviewForm" class="mt-5 space-y-4"><label class="block text-xs font-bold text-zinc-400">Rating<select id="rating" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label><label class="block text-xs font-bold text-zinc-400">Review<textarea id="reviewText" minlength="20" maxlength="2000" required rows="5" placeholder="Describe your experience, communication, and results…" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"></textarea></label><button class="rounded-xl bg-amber-400 px-5 py-3 font-black text-zinc-950">Publish verified review</button></form><p id="formStatus" class="mt-3 text-sm text-zinc-400"></p></section>
<section class="mt-8"><div id="reviews" class="space-y-4"><p class="text-zinc-500">Loading reviews…</p></div></section></main>
<script>
const client=window.forgefitSupabase,byId=id=>document.getElementById(id),professionalId=new URLSearchParams(location.search).get('id');let user,reviews=[],eligibleConnections=[];
byId('back').href='/professional-profile?id='+encodeURIComponent(professionalId||'');
const stars=n=>'★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);
async function load(){if(!professionalId)throw new Error('No professional selected.');const session=await client.auth.getSession();user=session.data.session?.user||null;const [profile,rows,summary]=await Promise.all([client.from('profiles').select('display_name').eq('id',professionalId).maybeSingle(),client.from('professional_reviews').select('*').eq('professional_id',professionalId).order('created_at',{ascending:false}),client.from('professional_review_summary').select('*').eq('professional_id',professionalId).maybeSingle()]);if(rows.error)throw rows.error;reviews=rows.data||[];byId('title').textContent='Reviews for '+(profile.data?.display_name||'this professional');byId('summary').textContent=summary.data?summary.data.average_rating+' / 5 · '+summary.data.review_count+' verified review'+(summary.data.review_count===1?'':'s'):'No verified reviews yet';if(user&&user.id!==professionalId){const c=await client.from('message_connections').select('id,status').eq('professional_id',professionalId).eq('client_id',user.id).in('status',['active','ended']);if(!c.error){eligibleConnections=(c.data||[]).filter(x=>!reviews.some(r=>r.connection_id===x.id));if(eligibleConnections.length)byId('reviewFormSection').classList.remove('hidden')}}render()}
function render(){const root=byId('reviews');root.replaceChildren();if(!reviews.length){root.innerHTML='<p class="rounded-2xl border border-dashed border-zinc-700 p-8 text-zinc-500">No reviews have been published.</p>';return}reviews.forEach(r=>{const card=document.createElement('article');card.className='rounded-2xl border border-white/10 bg-zinc-900 p-5';const top=document.createElement('div');top.className='flex items-start justify-between gap-3';top.innerHTML='<div><p class="font-black text-amber-300">'+stars(r.rating)+'</p><p class="mt-1 text-xs font-bold text-emerald-300">Verified ForgeFit client</p></div><p class="text-xs text-zinc-600">'+new Date(r.created_at).toLocaleDateString()+'</p>';const body=document.createElement('p');body.className='mt-4 whitespace-pre-wrap text-sm leading-6 text-zinc-300';body.textContent=r.review_text;card.append(top,body);if(r.professional_response){const response=document.createElement('div');response.className='mt-4 rounded-xl border border-sky-400/15 bg-sky-400/5 p-4';response.innerHTML='<p class="text-xs font-black text-sky-300">Professional response</p><p class="mt-2 text-sm text-zinc-300"></p>';response.lastChild.textContent=r.professional_response;card.append(response)}const actions=document.createElement('div');actions.className='mt-4 flex flex-wrap gap-2';if(user?.id===r.client_id){addButton(actions,'Edit my review',()=>editReview(r))}if(user?.id===professionalId&&!r.professional_response){addButton(actions,'Respond',()=>respond(r))}if(user&&user.id!==r.client_id){addButton(actions,'Report',()=>reportReview(r))}card.append(actions);root.append(card)})}
function addButton(root,label,fn){const b=document.createElement('button');b.className='rounded-lg border border-zinc-700 px-3 py-2 text-xs font-bold';b.textContent=label;b.onclick=fn;root.append(b)}
async function editReview(r){const text=prompt('Edit your review:',r.review_text);if(text===null)return;const rating=Number(prompt('Rating from 1 to 5:',r.rating));const result=await client.rpc('edit_professional_review',{review_uuid:r.id,new_rating:rating,new_text:text});if(result.error)return alert(result.error.message);await load()}
async function respond(r){const text=prompt('Write your professional response:');if(!text)return;const result=await client.rpc('respond_to_professional_review',{review_uuid:r.id,response_text:text});if(result.error)return alert(result.error.message);await load()}
async function reportReview(r){const reason=prompt('Why should this review be reviewed by ForgeFit?');if(!reason)return;const result=await client.from('professional_review_reports').insert({review_id:r.id,reporter_id:user.id,reason});alert(result.error?result.error.message:'Report submitted for review.')}
byId('reviewForm').onsubmit=async e=>{e.preventDefault();const connection=eligibleConnections[0];if(!connection)return;const result=await client.from('professional_reviews').insert({connection_id:connection.id,professional_id:professionalId,client_id:user.id,rating:Number(byId('rating').value),review_text:byId('reviewText').value.trim()});if(result.error){byId('formStatus').textContent=result.error.message;return}byId('reviewText').value='';byId('reviewFormSection').classList.add('hidden');await load()};
load().catch(e=>{byId('reviews').innerHTML='<p class="rounded-xl border border-rose-400/20 p-4 text-rose-300">'+e.message+'</p>'});
</script></body></html>
