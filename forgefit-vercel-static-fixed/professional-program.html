<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Workout Program · ForgeFit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,system-ui,sans-serif}</style></head>
<body class="min-h-screen bg-zinc-950 text-white"><header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/90 backdrop-blur"><div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4"><div class="flex items-center gap-4"><a href="/" class="text-sm font-bold text-zinc-400 hover:text-white">Home</a><a href="/professional-dashboard?tab=programs" class="text-sm font-black text-amber-300">← Back to program library</a></div><span class="text-sm font-black">Program editor</span></div></header>
<main id="loading" class="mx-auto max-w-6xl px-4 py-20 text-center text-zinc-400">Loading program editor…</main>
<main id="app" class="mx-auto hidden max-w-6xl px-4 py-8 sm:px-6">
<section class="rounded-3xl border border-fuchsia-400/20 bg-zinc-900/70 p-5 sm:p-8"><p class="text-xs font-black uppercase tracking-[.18em] text-fuchsia-300">Workout program details</p><form id="programForm" class="mt-5 grid gap-4"><label class="text-xs font-bold text-zinc-400">Program title<span class="mt-1 block font-normal text-zinc-500">The name clients will see on their workout plan.</span><input id="title" required maxlength="140" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"></label><label class="text-xs font-bold text-zinc-400">Program description<span class="mt-1 block font-normal text-zinc-500">Explain the purpose, schedule, and important instructions.</span><textarea id="description" maxlength="3000" rows="4" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"></textarea></label><label class="text-xs font-bold text-zinc-400">Duration in weeks<span class="mt-1 block font-normal text-zinc-500">How long the complete program is intended to run.</span><input id="weeks" required type="number" min="1" max="52" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"></label><button class="rounded-xl bg-fuchsia-400 px-5 py-3 font-black text-zinc-950">Save program details</button></form></section>
<section class="mt-6 rounded-3xl border border-white/10 bg-zinc-900/70 p-5 sm:p-8"><div class="flex items-end justify-between"><div><p class="text-xs font-black uppercase tracking-[.18em] text-sky-300">Workout structure</p><h2 class="mt-1 text-2xl font-black">Days and exercises</h2></div><span id="dayCount" class="text-xs text-zinc-500"></span></div><form id="dayForm" class="mt-5 grid gap-3 sm:grid-cols-[120px_1fr_auto]"><input id="dayNumber" required type="number" min="1" max="365" placeholder="Day #" class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><input id="dayTitle" required maxlength="140" placeholder="Workout day title" class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><button class="rounded-xl border border-sky-400/30 px-5 py-3 font-black text-sky-300">Add day</button></form><div id="days" class="mt-5 space-y-4"></div></section>
<section class="mt-6 rounded-3xl border border-emerald-400/15 bg-zinc-900/70 p-5 sm:p-8"><p class="text-xs font-black uppercase tracking-[.18em] text-emerald-300">Client assignments</p><h2 class="mt-1 text-2xl font-black">Assign and manage this program</h2><form id="assignForm" class="mt-5 grid gap-3 sm:grid-cols-[1fr_180px_auto]"><select id="clientSelect" required class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><option value="">Choose an approved client</option></select><input id="startDate" required type="date" class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><button class="rounded-xl bg-emerald-400 px-5 py-3 font-black text-zinc-950">Assign program</button></form><div id="assignments" class="mt-5 space-y-3"></div></section>
<p id="status" class="hidden mt-5 rounded-xl border px-4 py-3 text-sm"></p></main>
<main id="error" class="mx-auto hidden max-w-xl px-4 py-20 text-center"><h1 class="text-3xl font-black">We couldn’t open this program.</h1><p id="errorText" class="mt-3 text-zinc-400"></p><a href="/professional-dashboard?tab=programs" class="mt-5 inline-block text-amber-300">Return to programs</a></main>
<script>
const db=window.forgefitSupabase,el=id=>document.getElementById(id);let user,program,days=[],exercises=[],assignments=[],names={};const programId=new URLSearchParams(location.search).get('id');
function notice(message,type='success'){const box=el('status');box.textContent=message;box.className='mt-5 rounded-xl border px-4 py-3 text-sm '+(type==='error'?'border-rose-400/20 text-rose-300':'border-emerald-400/20 text-emerald-300')}
async function refresh(){const dayResult=await db.from('program_workouts').select('*').eq('program_id',programId).order('day_number'),assignmentResult=await db.from('program_assignments').select('*').eq('program_id',programId).order('created_at',{ascending:false});if(dayResult.error)throw dayResult.error;days=dayResult.data||[];assignments=assignmentResult.data||[];const ids=days.map(day=>day.id);exercises=ids.length?((await db.from('workout_exercises').select('*').in('workout_id',ids).order('exercise_order')).data||[]):[];render()}
function render(){el('dayCount').textContent=days.length+' day'+(days.length===1?'':'s');const box=el('days');box.replaceChildren();days.forEach(day=>{const card=document.createElement('article');card.className='rounded-2xl border border-white/10 bg-zinc-950 p-4';card.dataset.dayId=day.id;const head=document.createElement('div');head.className='flex items-center justify-between gap-3';const title=document.createElement('h3');title.className='font-black';title.textContent='Day '+day.day_number+' · '+day.title;const actions=document.createElement('div');actions.className='flex gap-3';actions.append(action('Edit','text-amber-300',()=>editDay(day)),action('Delete','text-rose-300',()=>deleteDay(day)));head.append(title,actions);card.append(head);exercises.filter(item=>item.workout_id===day.id).forEach(item=>{const row=document.createElement('div');row.className='mt-3 flex flex-col gap-2 rounded-xl bg-zinc-900 p-3 sm:flex-row sm:items-center sm:justify-between';row.dataset.exerciseId=item.id;const text=document.createElement('p');text.className='text-sm';text.textContent=item.exercise_order+'. '+item.name+' · '+(item.sets||'—')+' sets × '+(item.reps||'—')+(item.rest_seconds?' · '+item.rest_seconds+' sec rest':'');const a=document.createElement('div');a.className='flex gap-3';a.append(action('Edit','text-amber-300',()=>editExercise(item)),action('Delete','text-rose-300',()=>deleteExercise(item)));row.append(text,a);card.append(row)});const form=document.createElement('form');form.className='mt-4 grid gap-2 lg:grid-cols-5';form.innerHTML='<input required maxlength="160" placeholder="Exercise name" class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm"><input type="number" min="1" max="100" placeholder="Sets" class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm"><input maxlength="60" placeholder="Reps" class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm"><input type="number" min="0" max="3600" placeholder="Rest seconds" class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm"><button class="rounded-lg border border-fuchsia-400/30 px-3 py-2 text-sm font-black text-fuchsia-300">Add exercise</button>';form.onsubmit=event=>addExercise(event,day,form);card.append(form);box.append(card)});if(!box.children.length)box.innerHTML='<p class="rounded-xl border border-dashed border-zinc-700 p-5 text-sm text-zinc-500">No workout days yet.</p>';const assignmentBox=el('assignments');assignmentBox.replaceChildren();assignments.forEach(item=>{const row=document.createElement('div');row.className='flex flex-col gap-3 rounded-xl bg-zinc-950 p-4 sm:flex-row sm:items-center sm:justify-between';const text=document.createElement('p');text.className='text-sm font-bold';text.textContent=(names[item.client_id]||'ForgeFit client')+' · starts '+new Date(item.start_date+'T00:00:00').toLocaleDateString()+' · '+item.status;const select=document.createElement('select');select.className='rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm';['active','paused','completed','cancelled'].forEach(value=>select.add(new Option(value.replace(/^./,x=>x.toUpperCase()),value,value===item.status,value===item.status)));select.onchange=()=>updateAssignment(item,select.value);row.append(text,select);assignmentBox.append(row)});if(!assignmentBox.children.length)assignmentBox.innerHTML='<p class="text-sm text-zinc-500">This program is not assigned yet.</p>'}
function action(label,color,handler){const button=document.createElement('button');button.type='button';button.className='text-xs font-bold '+color;button.textContent=label;button.onclick=handler;return button}
el('programForm').onsubmit=async event=>{event.preventDefault();const result=await db.from('workout_programs').update({title:el('title').value.trim(),description:el('description').value.trim()||null,duration_weeks:Number(el('weeks').value),updated_at:new Date().toISOString()}).eq('id',programId).eq('professional_id',user.id).select().single();if(result.error)return notice(result.error.message,'error');program=result.data;notice('Program details saved.')}
el('dayForm').onsubmit=async event=>{event.preventDefault();const result=await db.from('program_workouts').insert({program_id:programId,day_number:Number(el('dayNumber').value),title:el('dayTitle').value.trim()}).select().single();if(result.error)return notice(result.error.message,'error');event.target.reset();await refresh();notice('Workout day added.')}
function editDay(day){const card=document.querySelector('[data-day-id="'+day.id+'"]'),head=card?.firstElementChild;if(!head)return;const form=document.createElement('form');form.className='grid gap-2 rounded-xl border border-amber-400/20 bg-zinc-900 p-3 sm:grid-cols-[110px_1fr_auto_auto]';const number=document.createElement('input');number.type='number';number.min='1';number.max='365';number.required=true;number.value=day.day_number;number.ariaLabel='Day number';number.className='rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm';const title=document.createElement('input');title.required=true;title.maxLength=140;title.value=day.title;title.ariaLabel='Workout day title';title.className='rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm';const save=document.createElement('button');save.className='rounded-lg bg-amber-400 px-4 py-2 text-xs font-black text-zinc-950';save.textContent='Save day';const cancel=document.createElement('button');cancel.type='button';cancel.className='rounded-lg border border-white/10 px-4 py-2 text-xs font-bold';cancel.textContent='Cancel';cancel.onclick=render;form.append(number,title,save,cancel);form.onsubmit=async event=>{event.preventDefault();save.disabled=true;const result=await db.from('program_workouts').update({day_number:Number(number.value),title:title.value.trim()}).eq('id',day.id).select().single();if(result.error){save.disabled=false;return notice(result.error.message,'error')}await refresh();notice('Workout day updated.')};head.replaceWith(form);title.focus()}
async function deleteDay(day){if(!confirm('Delete this workout day and all of its exercises?'))return;const result=await db.from('program_workouts').delete().eq('id',day.id);if(result.error)return notice(result.error.message,'error');await refresh();notice('Workout day deleted.')}
async function addExercise(event,day,form){event.preventDefault();const inputs=[...form.querySelectorAll('input')],order=exercises.filter(item=>item.workout_id===day.id).length+1,result=await db.from('workout_exercises').insert({workout_id:day.id,exercise_order:order,name:inputs[0].value.trim(),sets:Number(inputs[1].value)||null,reps:inputs[2].value.trim()||null,rest_seconds:Number(inputs[3].value)||null}).select().single();if(result.error)return notice(result.error.message,'error');form.reset();await refresh();notice('Exercise added.')}
function editExercise(item){const row=document.querySelector('[data-exercise-id="'+item.id+'"]');if(!row)return;row.replaceChildren();row.className='mt-3 rounded-xl border border-amber-400/20 bg-zinc-900 p-3';const form=document.createElement('form');form.className='grid gap-2 lg:grid-cols-[2fr_80px_110px_100px_auto_auto]';form.innerHTML='<input required maxlength="160" aria-label="Exercise name" class="rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"><input type="number" min="1" max="100" aria-label="Sets" class="rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"><input maxlength="60" aria-label="Repetitions" class="rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"><input type="number" min="0" max="3600" aria-label="Rest seconds" class="rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"><button class="rounded-lg bg-amber-400 px-3 py-2 text-xs font-black text-zinc-950">Save</button><button type="button" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-bold">Cancel</button>';const inputs=[...form.querySelectorAll('input')];inputs[0].value=item.name;inputs[1].value=item.sets??'';inputs[2].value=item.reps??'';inputs[3].value=item.rest_seconds??'';form.querySelector('button[type="button"]').onclick=render;form.onsubmit=async event=>{event.preventDefault();const save=form.querySelector('button:not([type="button"])');save.disabled=true;const result=await db.from('workout_exercises').update({name:inputs[0].value.trim(),sets:Number(inputs[1].value)||null,reps:inputs[2].value.trim()||null,rest_seconds:Number(inputs[3].value)||null}).eq('id',item.id).select().single();if(result.error){save.disabled=false;return notice(result.error.message,'error')}await refresh();notice('Exercise updated.')};row.append(form);inputs[0].focus()}
async function deleteExercise(item){if(!confirm('Delete '+item.name+'?'))return;const result=await db.from('workout_exercises').delete().eq('id',item.id);if(result.error)return notice(result.error.message,'error');await refresh();notice('Exercise deleted.')}
el('assignForm').onsubmit=async event=>{event.preventDefault();const payload={program_id:programId,professional_id:user.id,client_id:el('clientSelect').value,start_date:el('startDate').value,status:'active'},result=await db.from('program_assignments').upsert(payload,{onConflict:'program_id,client_id'}).select().single();if(result.error)return notice(result.error.message,'error');await refresh();notice('Program assigned.')}
async function updateAssignment(item,status){const result=await db.from('program_assignments').update({status}).eq('id',item.id).eq('professional_id',user.id);if(result.error)return notice(result.error.message,'error');await refresh();notice('Assignment status updated.')}
async function load(){if(!programId)throw new Error('No program was selected.');const session=(await db.auth.getSession()).data.session;if(!session){location.replace('/auth?role=professional');return}user=session.user;const result=await db.from('workout_programs').select('*').eq('id',programId).eq('professional_id',user.id).single();if(result.error)throw result.error;program=result.data;el('title').value=program.title;el('description').value=program.description||'';el('weeks').value=program.duration_weeks;el('startDate').value=new Date().toISOString().slice(0,10);const requests=await db.from('session_requests').select('client_id').eq('professional_id',user.id).eq('status','approved'),ids=[...new Set((requests.data||[]).map(item=>item.client_id))];if(ids.length){const profiles=await db.from('profiles').select('id,display_name').in('id',ids);(profiles.data||[]).forEach(profile=>names[profile.id]=profile.display_name);ids.forEach(id=>el('clientSelect').add(new Option(names[id]||'ForgeFit client',id)))}await refresh();el('loading').classList.add('hidden');el('app').classList.remove('hidden')}
load().catch(error=>{el('loading').classList.add('hidden');el('errorText').textContent=error.message;el('error').classList.remove('hidden')});
</script></body></html>
