<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find a Professional — ForgeFit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,system-ui,sans-serif}</style></head><body class="min-h-screen bg-zinc-950 text-white"><header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/90 backdrop-blur-xl"><div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6"><a href="/" class="flex items-center gap-3"><img src="/assets/forgefit-logo.png" alt="" class="h-9"><span class="text-xl font-black">ForgeFit</span></a><a href="/dashboard" class="rounded-xl border border-zinc-700 px-4 py-2 text-sm font-bold">Client dashboard</a></div></header><main class="mx-auto max-w-7xl px-4 py-10 sm:px-6"><p class="text-sm font-bold uppercase tracking-[.2em] text-violet-400">Professional discovery</p><h1 class="mt-2 text-4xl font-black">Find your ForgeFit team.</h1><p class="mt-3 max-w-3xl text-zinc-400">Recommendations are ranked from your goals, professional categories, preferred training format, and location preference.</p><section class="mt-7 grid gap-3 rounded-2xl border border-white/10 bg-zinc-900/70 p-4 lg:grid-cols-[1fr_220px_180px_auto]"><input id="search" type="search" placeholder="Search specialty or professional" class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><select id="category" class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><option value="">All specialties</option><option>Personal Training</option><option>Nutrition</option><option>Sports Coaching</option><option>Military Prep</option><option>Bodybuilding</option><option>Figure Competition</option><option>Mentoring</option></select><select id="format" class="rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3"><option value="">Any format</option><option value="virtual">Virtual</option><option value="in_person">In person</option><option value="hybrid">Hybrid</option></select><button id="searchButton" class="rounded-xl bg-violet-400 px-6 py-3 font-black text-zinc-950">Update matches</button></section><div id="preferenceSummary" class="mt-4 rounded-xl border border-violet-400/20 bg-violet-400/5 p-4 text-sm text-violet-200"></div><div class="mt-6 flex items-center justify-between"><h2 class="text-xl font-black">Recommended professionals</h2><span id="resultCount" class="text-xs text-zinc-500">Loading…</span></div><div id="professionalGrid" class="mt-4 grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div><p id="status" class="hidden mt-5 rounded-xl border border-rose-400/20 bg-rose-400/5 p-4 text-sm text-rose-300"></p></main><script>
const client=window.forgefitSupabase,byId=id=>document.getElementById(id);let professionals=[],clientProfile=null;
const params=new URLSearchParams(location.search),queryCategories=(params.get('categories')||'').split(',').map(x=>x.trim()).filter(Boolean),queryGoals=(params.get('goals')||'').split(',').map(x=>x.trim()).filter(Boolean),queryFormat=params.get('format')||'',queryCity=params.get('city')||'';
function scoreProfessional(p){const category=(p.category||'').toLowerCase(),headline=(p.headline||'').toLowerCase(),topics=[...queryCategories,...queryGoals,...(clientProfile?.preferred_categories||[]),...(clientProfile?.goals||[])].join(' ').toLowerCase();let score=0;[...(queryCategories||[]),...(clientProfile?.preferred_categories||[])].forEach(x=>{if(category.includes(String(x).toLowerCase()))score+=8});category.split(/\s+/).concat(headline.split(/\s+/)).forEach(word=>{if(word.length>3&&topics.includes(word))score+=2});const preferred=queryFormat||clientProfile?.preferred_format;if(preferred&&p.service_format===preferred)score+=5;if(preferred==='hybrid'&&['virtual','in_person'].includes(p.service_format))score+=2;return score}
function render(){const q=byId('search').value.trim().toLowerCase(),category=byId('category').value.toLowerCase(),format=byId('format').value,grid=byId('professionalGrid');grid.replaceChildren();const ranked=professionals.map(p=>({...p,matchScore:scoreProfessional(p)})).filter(p=>(!q||[p.category,p.headline,p.profiles?.display_name].join(' ').toLowerCase().includes(q))&&(!category||(p.category||'').toLowerCase().includes(category))&&(!format||p.service_format===format||(format==='hybrid'&&['virtual','in_person'].includes(p.service_format)))).sort((a,b)=>b.matchScore-a.matchScore||Number(b.years_experience||0)-Number(a.years_experience||0));byId('resultCount').textContent=ranked.length+' match'+(ranked.length===1?'':'es');if(!ranked.length){grid.innerHTML='<p class="rounded-xl border border-dashed border-zinc-700 p-6 text-zinc-500 md:col-span-2 xl:col-span-3">No published professionals match these filters yet.</p>';return}ranked.forEach((p,index)=>{const card=document.createElement('article');card.className='rounded-2xl border border-white/10 bg-zinc-900 p-5';const top=document.createElement('div');top.className='flex items-start justify-between gap-3';const heading=document.createElement('div');const eyebrow=document.createElement('p');eyebrow.className='text-xs font-bold uppercase tracking-wide text-violet-300';eyebrow.textContent=index<3&&p.matchScore>0?'Recommended match':p.category;const name=document.createElement('h3');name.className='mt-1 text-xl font-black';name.textContent=p.profiles?.display_name||'ForgeFit professional';heading.append(eyebrow,name);const score=document.createElement('span');score.className='rounded-full border border-white/10 px-3 py-1 text-xs text-zinc-400';score.textContent=p.matchScore+' match pts';top.append(heading,score);const headline=document.createElement('p');headline.className='mt-3 text-sm leading-6 text-zinc-400';headline.textContent=p.headline||p.category;const meta=document.createElement('p');meta.className='mt-3 text-xs text-zinc-500';meta.textContent=(p.service_format||'hybrid').replace('_',' ')+' · '+(p.years_experience??0)+' years experience';const action=document.createElement('a');action.href='/dashboard?professional='+encodeURIComponent(p.user_id)+'#sessions';action.className='mt-4 inline-block rounded-lg bg-violet-400 px-4 py-2 text-sm font-black text-zinc-950';action.textContent='Request a session';card.append(top,headline,meta,action);grid.append(card)})}
async function load(){const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/auth?role=client&next=/find-professional');return}const [profileResult,professionalResult]=await Promise.all([client.from('client_profiles').select('goals,preferred_categories,preferred_format,city').eq('user_id',session.user.id).single(),client.from('professional_profiles').select('user_id,category,headline,years_experience,service_format,profiles(display_name)').eq('published',true).eq('accepting_clients',true)]);clientProfile=profileResult.data||{};if(professionalResult.error)throw professionalResult.error;professionals=professionalResult.data||[];const categories=queryCategories.length?queryCategories:(clientProfile.preferred_categories||[]),goals=queryGoals.length?queryGoals:(clientProfile.goals||[]),format=queryFormat||clientProfile.preferred_format||'',city=queryCity||clientProfile.city||'';byId('category').value=categories.find(x=>[...byId('category').options].some(o=>o.value.toLowerCase()===String(x).toLowerCase()))||'';byId('format').value=format;byId('preferenceSummary').textContent='Auto-filled from your profile: '+(categories.join(', ')||'all specialties')+' · '+(goals.join(', ')||'all goals')+' · '+(format||'any format')+(city?' · near '+city+' when professional location data is available':'');render()}
byId('searchButton').onclick=render;byId('search').oninput=render;byId('category').onchange=render;byId('format').onchange=render;load().catch(error=>{byId('status').textContent=error.message;byId('status').classList.remove('hidden')});
</script></body></html>
