<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find a Professional — ForgeFit</title><meta name="description" content="Find trainers, nutritionists, sport coaches, mentors, competition specialists, and other ForgeFit professionals."><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,system-ui,sans-serif}</style></head>
<body class="min-h-screen bg-zinc-950 text-white"><header class="sticky top-0 z-40 border-b border-white/10 bg-zinc-950/90 backdrop-blur-xl"><div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6"><a href="/" class="flex items-center gap-3"><img src="/assets/forgefit-logo.png" alt="" class="h-9"><span class="text-xl font-black">ForgeFit</span></a><div class="flex gap-2"><a href="/community-feed" class="hidden rounded-xl border border-zinc-700 px-4 py-2 text-sm font-bold sm:inline-flex">Community Feed</a><a href="/dashboard?tab=professionals" class="rounded-xl border border-zinc-700 px-4 py-2 text-sm font-bold">Client dashboard</a></div></div></header>
<main class="mx-auto max-w-7xl px-4 py-10 sm:px-6"><p class="text-sm font-bold uppercase tracking-[.2em] text-violet-400">Professional discovery</p><h1 class="mt-2 text-4xl font-black sm:text-5xl">Find the right professional for your goals.</h1><p class="mt-3 max-w-3xl leading-7 text-zinc-400">Search locally or anywhere, choose in-person or virtual support, and match with professionals whose services align with what you want to accomplish.</p>
<section class="mt-7 rounded-3xl border border-white/10 bg-zinc-900/70 p-5"><div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
<label class="text-xs font-bold text-zinc-400">Name, service, or keyword<input id="search" type="search" placeholder="CrossFit, strength, nutrition…" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"></label>
<label class="text-xs font-bold text-zinc-400">Primary goal<select id="goal" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"><option value="">All goals</option><option>Build strength</option><option>Improve mobility</option><option>Weight management</option><option>Sports performance</option><option>CrossFit</option><option>Military preparation</option><option>Health and accountability</option><option>Professional bodybuilding competition</option><option>Figure competition</option><option>IFBB show preparation</option></select></label>
<label class="text-xs font-bold text-zinc-400">Professional specialty<select id="category" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"><option value="">All specialties</option><option>Personal Training</option><option>Nutrition</option><option>Sports Coaching</option><option>CrossFit</option><option>Military Prep</option><option>Bodybuilding</option><option>Figure Competition</option><option>IFBB Competition Prep</option><option>Mentoring</option><option>Physical Therapy</option></select></label>
<label class="text-xs font-bold text-zinc-400">Training format<select id="format" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"><option value="">Any format</option><option value="virtual">Virtual</option><option value="in_person">In person</option><option value="hybrid">Hybrid</option></select></label>
<label class="text-xs font-bold text-zinc-400">Location<input id="location" placeholder="City or state" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"></label>
<label class="text-xs font-bold text-zinc-400">Location preference<select id="locationScope" class="mt-2 w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-white"><option value="anywhere">Anywhere</option><option value="near">Near this location</option></select></label>
</div><div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><label class="text-xs font-bold text-zinc-400">Sort results <select id="sort" class="ml-2 rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-white"><option value="match">Best match</option><option value="experience">Most experience</option><option value="name">Name</option></select></label><div class="flex gap-3"><button id="resetButton" class="rounded-xl border border-zinc-700 px-5 py-3 text-sm font-bold">Reset</button><button id="searchButton" class="rounded-xl bg-violet-400 px-6 py-3 text-sm font-black text-zinc-950">Update matches</button></div></div></section>
<div id="preferenceSummary" class="mt-4 rounded-xl border border-violet-400/20 bg-violet-400/5 p-4 text-sm text-violet-200"></div>
<div class="mt-7 flex items-center justify-between"><h2 class="text-xl font-black">Professional matches</h2><span id="resultCount" class="text-xs text-zinc-500">Loading…</span></div><div id="professionalGrid" class="mt-4 grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div><p id="status" class="hidden mt-5 rounded-xl border border-rose-400/20 bg-rose-400/5 p-4 text-sm text-rose-300"></p></main>
<script>
const client=window.forgefitSupabase,byId=id=>document.getElementById(id);let professionals=[],clientProfile={},profileLocation={};
const params=new URLSearchParams(location.search),queryCategories=(params.get('categories')||'').split(',').map(x=>x.trim()).filter(Boolean),queryGoals=(params.get('goals')||'').split(',').map(x=>x.trim()).filter(Boolean),queryFormat=params.get('format')||'',queryCity=params.get('city')||'';
const goalTerms={'Build strength':['strength','powerlifting','weightlifting','resistance'],'Improve mobility':['mobility','flexibility','movement','rehab','physical therapy'],'Weight management':['weight','fat loss','nutrition','body composition'],'Sports performance':['sport','athlete','performance','speed','agility'],'CrossFit':['crossfit','functional fitness','functional training'],'Military preparation':['military','tactical','pt test','combat'],'Health and accountability':['accountability','wellness','health','habit','mentor'],'Professional bodybuilding competition':['bodybuilding','competition prep','physique','ifbb'],'Figure competition':['figure','competition prep','physique','ifbb'],'IFBB show preparation':['ifbb','show prep','competition prep','bodybuilding','figure']};
function searchable(p){return [p.category,p.headline,...(p.service_areas||[]),p.profiles?.display_name,p.profiles?.city,p.profiles?.region].filter(Boolean).join(' ').toLowerCase()}
function selectedGoal(){return byId('goal').value}
function goalMatch(p,goal){if(!goal)return true;const hay=searchable(p),terms=goalTerms[goal]||[goal.toLowerCase()];return terms.some(term=>hay.includes(term))}
function formatMatch(p,format){if(!format)return true;if(format==='hybrid')return p.service_format==='hybrid';return p.service_format===format||p.service_format==='hybrid'}
function locationMatch(p){if(byId('locationScope').value!=='near')return true;const wanted=byId('location').value.trim().toLowerCase();if(!wanted)return true;return [p.profiles?.city,p.profiles?.region].filter(Boolean).join(' ').toLowerCase().includes(wanted)}
function scoreProfessional(p){const hay=searchable(p),goal=selectedGoal(),category=byId('category').value,format=byId('format').value,wanted=byId('location').value.trim().toLowerCase();let score=0,reasons=[];if(goal&&goalMatch(p,goal)){score+=14;reasons.push(goal)}else{const profileGoals=clientProfile.goals||[];for(const g of profileGoals){if(goalMatch(p,g)){score+=5;reasons.push(g);break}}}if(category&&hay.includes(category.toLowerCase())){score+=12;reasons.push(category)}else for(const cat of clientProfile.preferred_categories||[]){if(hay.includes(String(cat).toLowerCase())){score+=5;reasons.push(cat);break}}if(format&&formatMatch(p,format)){score+=7;reasons.push(format.replace('_',' '))}else if(!format&&clientProfile.preferred_format&&formatMatch(p,clientProfile.preferred_format)){score+=3;reasons.push(clientProfile.preferred_format.replace('_',' '))}if(wanted&&locationMatch(p)){score+=8;reasons.push('near '+wanted)}return {score,reasons:[...new Set(reasons)].slice(0,3)}}
function render(){const q=byId('search').value.trim().toLowerCase(),category=byId('category').value.toLowerCase(),format=byId('format').value,goal=selectedGoal(),sort=byId('sort').value,grid=byId('professionalGrid');grid.replaceChildren();let ranked=professionals.map(p=>{const match=scoreProfessional(p);return {...p,matchScore:match.score,matchReasons:match.reasons}}).filter(p=>(!q||searchable(p).includes(q))&&(!category||searchable(p).includes(category))&&goalMatch(p,goal)&&formatMatch(p,format)&&locationMatch(p));if(sort==='experience')ranked.sort((a,b)=>Number(b.years_experience||0)-Number(a.years_experience||0));else if(sort==='name')ranked.sort((a,b)=>(a.profiles?.display_name||'').localeCompare(b.profiles?.display_name||''));else ranked.sort((a,b)=>b.matchScore-a.matchScore||Number(b.years_experience||0)-Number(a.years_experience||0));byId('resultCount').textContent=ranked.length+' professional'+(ranked.length===1?'':'s');if(!ranked.length){grid.innerHTML='<p class="rounded-2xl border border-dashed border-zinc-700 p-8 text-zinc-500 md:col-span-2 xl:col-span-3">No published professionals match every selected filter. Try Anywhere, Any format, or remove one specialty filter.</p>';return}ranked.forEach((p,index)=>{const card=document.createElement('article');card.className='flex flex-col rounded-3xl border border-white/10 bg-zinc-900 p-5';const eyebrow=document.createElement('p');eyebrow.className='text-xs font-bold uppercase tracking-wide text-violet-300';eyebrow.textContent=index<3&&p.matchScore>0?'Recommended for you':(p.category||'ForgeFit professional');const name=document.createElement('h3');name.className='mt-1 text-xl font-black';name.textContent=p.profiles?.display_name||'ForgeFit professional';const headline=document.createElement('p');headline.className='mt-3 text-sm leading-6 text-zinc-400';headline.textContent=p.headline||p.category||'ForgeFit professional';card.append(eyebrow,name,headline);if(p.matchReasons.length){const tags=document.createElement('div');tags.className='mt-3 flex flex-wrap gap-2';p.matchReasons.forEach(reason=>{const tag=document.createElement('span');tag.className='rounded-full border border-violet-400/20 bg-violet-400/5 px-2.5 py-1 text-[10px] font-bold text-violet-200';tag.textContent=reason;tags.append(tag)});card.append(tags)}const services=document.createElement('p');services.className='mt-3 text-xs leading-5 text-zinc-500';services.textContent=(p.service_areas||[]).slice(0,4).join(' · ')||p.category||'Services available';const locationLine=document.createElement('p');locationLine.className='mt-2 text-xs text-zinc-500';locationLine.textContent=[p.profiles?.city,p.profiles?.region].filter(Boolean).join(', ')||'Location not listed';const formatLine=document.createElement('p');formatLine.className='mt-2 text-xs font-bold text-emerald-300';formatLine.textContent=(p.service_format||'hybrid').replace('_',' ')+' · '+(p.years_experience??0)+' years experience';const actions=document.createElement('div');actions.className='mt-auto flex gap-2 pt-5';const view=document.createElement('a');view.href='/professional-profile?id='+encodeURIComponent(p.user_id);view.className='flex-1 rounded-xl border border-violet-400/30 px-3 py-2.5 text-center text-xs font-black text-violet-300';view.textContent='View profile';const request=document.createElement('a');request.href='/dashboard?tab=sessions&professional='+encodeURIComponent(p.user_id);request.className='flex-1 rounded-xl bg-violet-400 px-3 py-2.5 text-center text-xs font-black text-zinc-950';request.textContent='Request service';actions.append(view,request);card.append(services,locationLine,formatLine,actions);grid.append(card)})}
function syncUrl(){const url=new URL(location.href);[['goal','goal'],['category','categories'],['format','format'],['location','city']].forEach(([id,key])=>{const value=byId(id).value.trim();value?url.searchParams.set(key,value):url.searchParams.delete(key)});history.replaceState({},'',url)}
async function load(){const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/auth?role=client&next=/find-professional');return}const [clientResult,profileResult,professionalResult]=await Promise.all([client.from('client_profiles').select('goals,preferred_categories,preferred_format').eq('user_id',session.user.id).maybeSingle(),client.from('profiles').select('city,region').eq('id',session.user.id).maybeSingle(),client.from('professional_profiles').select('user_id,category,headline,years_experience,service_format,service_areas,profiles(display_name,city,region)').eq('published',true).eq('accepting_clients',true)]);clientProfile=clientResult.data||{};profileLocation=profileResult.data||{};if(professionalResult.error)throw professionalResult.error;professionals=professionalResult.data||[];const categories=queryCategories.length?queryCategories:(clientProfile.preferred_categories||[]),goals=queryGoals.length?queryGoals:(clientProfile.goals||[]),format=queryFormat||clientProfile.preferred_format||'',place=queryCity||[profileLocation.city,profileLocation.region].filter(Boolean).join(', ');byId('category').value=categories.find(x=>[...byId('category').options].some(o=>o.value.toLowerCase()===String(x).toLowerCase()))||'';byId('goal').value=goals.find(x=>[...byId('goal').options].some(o=>o.value.toLowerCase()===String(x).toLowerCase()))||'';byId('format').value=format;byId('location').value=place;byId('locationScope').value=queryCity?'near':'anywhere';byId('preferenceSummary').textContent='Suggested from your profile: '+(goals.join(', ')||'all goals')+' · '+(categories.join(', ')||'all specialties')+' · '+(format||'any format')+(place?' · '+place+' available when you choose Near this location':'');render()}
['search','goal','category','format','location','locationScope','sort'].forEach(id=>{byId(id).oninput=()=>{syncUrl();render()};byId(id).onchange=()=>{syncUrl();render()}});byId('searchButton').onclick=()=>{syncUrl();render()};byId('resetButton').onclick=()=>{['search','goal','category','format','location'].forEach(id=>byId(id).value='');byId('locationScope').value='anywhere';byId('sort').value='match';syncUrl();render()};load().catch(error=>{byId('status').textContent=error.message;byId('status').classList.remove('hidden')});
</script></body></html>
