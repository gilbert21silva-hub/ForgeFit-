<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Log · ForgeFit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,system-ui,sans-serif}@page{size:landscape;margin:.35in}@media print{body *{visibility:hidden!important}#sheet,#sheet *{visibility:visible!important}#sheet{position:absolute;inset:0 auto auto 0;width:100%;margin:0!important;box-shadow:none!important}.no-print{display:none!important}}</style></head><body class="min-h-screen bg-zinc-950 text-white"><header class="no-print border-b border-white/10"><div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4"><div class="flex gap-4 text-sm font-bold"><a href="/" class="text-zinc-400">Home</a><a href="/dashboard?tab=programs" class="text-sky-300">← My Training</a></div><strong>Workout log</strong></div></header><main id="loading" class="p-20 text-center text-zinc-400">Loading your workout log…</main><main id="app" class="mx-auto hidden max-w-7xl p-4"><div class="no-print mb-4 flex flex-col gap-3 rounded-2xl border border-white/10 bg-zinc-900 p-4 sm:flex-row sm:items-center sm:justify-between"><div><p class="text-sm font-black">Choose a week, then print or save it as a PDF.</p><select id="week" class="mt-2 rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm"></select></div><button id="print" class="rounded-xl bg-white px-5 py-3 text-sm font-black text-zinc-950">Print this week / Save PDF</button></div><div class="overflow-x-auto"><article id="sheet" class="min-w-[900px] bg-white p-8 text-zinc-950 shadow-2xl"><div class="flex items-start justify-between border-b-2 border-zinc-950 pb-4"><div><p class="text-xs font-black uppercase tracking-[.18em] text-orange-600">ForgeFit weekly workout log</p><h1 id="programTitle" class="mt-1 text-3xl font-black"></h1></div><p id="weekLabel" class="rounded border border-zinc-500 px-3 py-2 text-xs font-black"></p></div><div class="mt-4 grid grid-cols-3 gap-4 border-b border-zinc-400 pb-3 text-xs"><p><b>CLIENT / ATHLETE</b> <span id="clientName" class="ml-2 inline-block min-w-36 border-b border-zinc-700"></span></p><p><b>WEEK</b> <span id="weekNumber" class="ml-2"></span></p><p><b>DATE RANGE</b> <span class="ml-2 inline-block min-w-36 border-b border-zinc-700">&nbsp;</span></p></div><div id="goals" class="mt-3 grid grid-cols-[70px_1fr] border border-zinc-500 text-xs"><b class="bg-zinc-100 p-2">GOALS</b><p id="description" class="whitespace-pre-wrap p-2"></p></div><div id="days" class="mt-4 space-y-5"></div><p id="footer" class="mt-7 border-t border-zinc-300 pt-3 text-center text-[10px] text-zinc-500"></p></article></div></main><main id="error" class="hidden p-20 text-center"><h1 class="text-3xl font-black">We couldn’t open this workout log.</h1><p id="errorText" class="mt-3 text-zinc-400"></p></main><script>
const db=window.forgefitSupabase,el=id=>document.getElementById(id),assignmentId=new URLSearchParams(location.search).get('assignment');let assignment,program,days=[],exercises=[],profile;
function cell(text,index){const item=document.createElement('div');item.className='border-b border-r border-zinc-500 p-2 '+(index===0?'text-center text-base':index===1?'font-bold':'');item.textContent=text||' ';return item}
function render(){const week=Number(el('week').value||1);el('programTitle').textContent=program.title;el('weekLabel').textContent='Week '+week+' of '+program.duration_weeks;el('weekNumber').textContent=week+' of '+program.duration_weeks;el('clientName').textContent=profile.display_name||'ForgeFit client';el('description').textContent=program.description||'Follow the prescribed workout plan.';el('goals').classList.toggle('hidden',!program.description);const box=el('days');box.replaceChildren();days.forEach(day=>{const section=document.createElement('section');section.className='break-inside-avoid';const head=document.createElement('div');head.className='grid grid-cols-[1fr_170px_150px] items-end border-b-2 border-zinc-950 pb-1 text-xs';head.innerHTML='<h2 class="text-base font-black uppercase">Day '+day.day_number+' · </h2><p><b>WORKOUT DATE</b> __________</p><p><b>BODY WEIGHT</b> ________</p>';head.querySelector('h2').append(document.createTextNode(day.title));section.append(head);const table=document.createElement('div');table.className='mt-1 border-l border-t border-zinc-500';const header=document.createElement('div');header.className='grid grid-cols-[38px_minmax(170px,1.5fr)_55px_65px_60px_75px_80px_85px_minmax(135px,1fr)] bg-zinc-100 text-[9px] font-black uppercase';['Done','Exercise','Sets','Reps','Rest','Weight','Time','Distance','Notes'].forEach((text,index)=>header.append(cell(text,index)));table.append(header);const rows=exercises.filter(item=>item.workout_id===day.id);rows.forEach(exercise=>{const row=document.createElement('div');row.className='grid min-h-10 grid-cols-[38px_minmax(170px,1.5fr)_55px_65px_60px_75px_80px_85px_minmax(135px,1fr)] text-[11px]';['□',exercise.exercise_order+'. '+exercise.name,exercise.sets||'—',exercise.reps||'—',exercise.rest_seconds?exercise.rest_seconds+'s':'—','','','',''].forEach((text,index)=>row.append(cell(text,index)));table.append(row)});section.append(table);const notes=document.createElement('div');notes.className='grid min-h-12 grid-cols-[90px_1fr] border-x border-b border-zinc-500 text-xs';notes.innerHTML='<b class="bg-zinc-100 p-2">DAY NOTES</b><div></div>';section.append(notes);box.append(section)});el('footer').textContent='Week '+week+' of '+program.duration_weeks+' · Forge Yourself, Forge Your Own · Track results consistently and follow your professional’s guidance.'}
async function load(){if(!assignmentId)throw new Error('No assigned program was selected.');const session=(await db.auth.getSession()).data.session;if(!session){location.replace('/auth?next=/dashboard?tab=programs');return}const assignmentResult=await db.from('program_assignments').select('*').eq('id',assignmentId).eq('client_id',session.user.id).single();if(assignmentResult.error)throw assignmentResult.error;assignment=assignmentResult.data;const [programResult,profileResult]=await Promise.all([db.from('workout_programs').select('*').eq('id',assignment.program_id).single(),db.from('profiles').select('display_name').eq('id',session.user.id).single()]);if(programResult.error)throw programResult.error;program=programResult.data;profile=profileResult.data||{};const dayResult=await db.from('program_workouts').select('*').eq('program_id',program.id).order('day_number');if(dayResult.error)throw dayResult.error;days=dayResult.data||[];const ids=days.map(day=>day.id);if(ids.length){const exerciseResult=await db.from('workout_exercises').select('*').in('workout_id',ids).order('exercise_order');if(exerciseResult.error)throw exerciseResult.error;exercises=exerciseResult.data||[]}for(let week=1;week<=program.duration_weeks;week++)el('week').add(new Option('Week '+week+' of '+program.duration_weeks,String(week)));el('week').onchange=render;el('print').onclick=()=>window.print();render();el('loading').classList.add('hidden');el('app').classList.remove('hidden')}load().catch(error=>{el('loading').classList.add('hidden');el('errorText').textContent=error.message;el('error').classList.remove('hidden')});
</script></body></html>
